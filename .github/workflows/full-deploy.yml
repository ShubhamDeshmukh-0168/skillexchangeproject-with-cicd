# name: Full Deploy - Infra + Build + Deploy

# One trigger does everything: create/update AWS infra with Terraform,
# build the WAR, build+push a Docker image, then deploy the WAR onto
# whatever server Terraform just reported - no manual steps, no
# copy/pasting IPs between jobs or secrets.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # 1. INFRA - creates/updates the VPC, EC2 app server, and RDS via
  #    Terraform. Its output (the server's IP) feeds directly into the
  #    deploy job below as a job output, nothing goes through secrets.
  # ------------------------------------------------------------------
  infra:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      app_ip: ${{ steps.tf_outputs.outputs.app_ip }}
      instance_id: ${{ steps.tf_outputs.outputs.instance_id }}
      artifact_bucket: ${{ steps.state_bucket.outputs.bucket }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.USE_OIDC == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure AWS credentials (access keys)
        if: ${{ vars.USE_OIDC != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Ensure Terraform state bucket exists
        id: state_bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}"
          BUCKET="tfstate-skillexchange-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET already exists."
          else
            echo "Creating state bucket $BUCKET in $REGION..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.state_bucket.outputs.bucket }}" \
            -backend-config="key=skillexchange/terraform.tfstate" \
            -backend-config="region=${{ steps.state_bucket.outputs.region }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Read outputs
        id: tf_outputs
        run: |
          echo "app_ip=$(terraform output -raw app_public_ip)" >> "$GITHUB_OUTPUT"
          echo "instance_id=$(terraform output -raw app_instance_id)" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # 2. BUILD - compiles the WAR. Independent of infra, so it runs in
  #    parallel with the Terraform job above to save time.
  # ------------------------------------------------------------------
  build:
    name: Build WAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-war
          path: target/SkillExchangeProject.war
          retention-days: 14

  # ------------------------------------------------------------------
  # 3. DOCKER - versioned image pushed to GHCR (backup / portable copy,
  #    not required for the EC2 deploy path below).
  # ------------------------------------------------------------------
  docker:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-war
          path: target

      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}

  # ------------------------------------------------------------------
  # 4. DEPLOY - ships the WAR to whatever IP the infra job just
  #    created/confirmed, restarts Tomcat, health-checks it, and rolls
  #    back automatically on failure.
  # ------------------------------------------------------------------
  deploy:
    name: Deploy via AWS SSM
    needs: [infra, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-war
          path: target

      - name: Configure AWS credentials
        if: ${{ vars.USE_OIDC == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure AWS credentials (access keys)
        if: ${{ vars.USE_OIDC != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload WAR to S3
        run: |
          aws s3 cp target/SkillExchangeProject.war \
            "s3://${{ needs.infra.outputs.artifact_bucket }}/artifacts/SkillExchangeProject.war"

      - name: Wait for instance to be SSM-managed (first run can take a few minutes)
        run: |
          INSTANCE_ID="${{ needs.infra.outputs.instance_id }}"
          echo "Waiting for SSM agent to register..."
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "None")
            if [ "$STATUS" = "Online" ]; then
              echo "Instance is online in SSM."
              break
            fi
            echo "  not ready yet ($i/30): $STATUS, retrying in 10s..."
            sleep 10
          done

      - name: Wait for the bootstrap script to finish (Java/Tomcat/Nginx install)
        run: |
          INSTANCE_ID="${{ needs.infra.outputs.instance_id }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["for i in $(seq 1 60); do test -f /opt/deploy.sh && echo BOOTSTRAP_OK && exit 0; sleep 10; done; echo BOOTSTRAP_TIMEOUT; tail -n 150 /var/log/cloud-init-output.log; exit 1"]' \
            --comment "Wait for bootstrap" \
            --query "Command.CommandId" --output text)

          echo "Waiting for bootstrap to complete (up to 10 min)..."
          for i in $(seq 1 65); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) echo "Bootstrap finished."; break ;;
              Failed|Cancelled|TimedOut)
                echo "Bootstrap did not finish in time or failed. Last 150 lines of the bootstrap log:"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" --output text
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
              *) sleep 10 ;;
            esac
          done

      - name: Run deploy script on EC2 via SSM
        run: |
          INSTANCE_ID="${{ needs.infra.outputs.instance_id }}"
          BUCKET="${{ needs.infra.outputs.artifact_bucket }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"/opt/deploy.sh $BUCKET\"]" \
            --comment "Deploy SkillExchangeProject WAR" \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"
          echo "Waiting for deploy to finish..."

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) echo "Deploy succeeded."; break ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy failed with status: $STATUS"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" --output text
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
              *) echo "  status: $STATUS ($i/30), waiting..."; sleep 10 ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

      - name: Health check via public URL
        run: |
          sleep 5
          curl -sf -o /dev/null http://${{ needs.infra.outputs.app_ip }}/ && echo "✅ Site is live at http://${{ needs.infra.outputs.app_ip }}/" || (echo "❌ Site did not respond" && exit 1)
